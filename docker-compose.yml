# docker compose run --rm check   pnpm run check: lint, format, typecheck, coverage, build
# docker compose run --rm build   builds the extension into ./dist for "Load unpacked"
services:
  check:
    build:
      context: .
      target: deps
    command: pnpm run check

  build:
    build:
      context: .
      target: deps
    command: sh -c "pnpm run build && rm -rf /out/* && cp -r dist/. /out/"
    volumes:
      - ./dist:/out
